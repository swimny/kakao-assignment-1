<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <h1 class="app-title">My Todo</h1>

        <!-- 날짜 네비게이터 (일간 뷰) -->
        <div class="date-nav">
          <button id="prevDayButton" class="date-nav-button" aria-label="이전 날짜">&#8249;</button>
          <div class="date-nav-center">
            <span id="dateLabel" class="date-label"></span>
          </div>
          <button id="nextDayButton" class="date-nav-button" aria-label="다음 날짜">&#8250;</button>
        </div>
        <!-- 오늘이 아닌 날짜일 때만 표시 — 날짜 네비게이터 외부에 배치하여 높이 변동 방지 -->
        <div class="today-button-row">
          <button id="todayButton" class="today-button hidden">Today</button>
        </div>

        <!-- 주간 뷰 -->
        <div class="week-view">
          <div class="week-header">
            <button id="prevWeekButton" class="week-nav-btn" aria-label="이전 주">&#8249;</button>
            <!-- 클릭하면 월간 달력 모달 표시 -->
            <span id="weekRangeLabel" class="week-range-label" role="button" aria-haspopup="dialog"></span>
            <button id="nextWeekButton" class="week-nav-btn" aria-label="다음 주">&#8250;</button>
          </div>
          <!-- 7개의 날짜 셀이 JS로 렌더링됨 -->
          <div id="weekGrid" class="week-grid"></div>
        </div>
      </header>

      <!-- Todo 입력 영역 -->
      <section class="input-section">
        <div class="input-wrapper">
          <input
            type="text"
            id="todoInput"
            class="todo-input"
            placeholder="새로운 할 일을 입력하세요"
            maxlength="100"
          />
          <button id="addButton" class="add-button">추가</button>
        </div>
        <!-- 입력값이 비어있을 때 표시할 안내 메시지 -->
        <p id="errorMessage" class="error-message hidden">할 일을 입력해주세요.</p>
      </section>

      <!-- 상태별 필터 탭 -->
      <div class="filter-tabs" role="tablist">
        <button class="filter-tab active" data-filter="all" role="tab">전체</button>
        <button class="filter-tab" data-filter="active" role="tab">진행 중</button>
        <button class="filter-tab" data-filter="completed" role="tab">완료</button>
      </div>

      <!-- Todo 목록 영역 -->
      <section class="list-section">
        <ul id="todoList" class="todo-list"></ul>
        <!-- Todo가 없을 때 표시할 빈 상태 안내 -->
        <div id="emptyState" class="empty-state">
          <span class="empty-icon">✓</span>
          <p>할 일이 없습니다. 새로운 Todo를 추가해보세요!</p>
        </div>
      </section>
    </div>

    <!-- 월간 달력 모달 — body 레벨에 배치해 전체 화면 기준으로 중앙 정렬 -->
    <div id="calendarPopup" class="cal-modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="cal-modal">
        <div class="cal-header">
          <button id="calPrevMonth" class="cal-nav-btn" aria-label="이전 달">&#8249;</button>
          <span id="calMonthLabel" class="cal-month-label"></span>
          <button id="calNextMonth" class="cal-nav-btn" aria-label="다음 달">&#8250;</button>
        </div>
        <!-- 일요일 시작, 토요일 끝 -->
        <div class="cal-weekdays">
          <span class="col-sun">일</span>
          <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span>
          <span class="col-sat">토</span>
        </div>
        <div id="calGrid" class="cal-grid"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
